{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Admin Dashboard | TravelVista{% endblock %}</title>

    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'main/css/style.css' %}">

    
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">

    <style>
        body {
            min-height: 100vh;
            background-color: #f8f9fa;
        }
        .sidebar {
            height: 100vh;
            background-color: #343a40;
            color: white;
            padding-top: 20px;
        }
        .sidebar a {
            color: white;
            text-decoration: none;
            display: block;
            padding: 10px 20px;
        }
        .sidebar a:hover {
            background-color: #495057;
        }
    </style>
</head>
<body>

<div class="container-fluid">
    <div class="row">
        
        <div class="col-md-2 sidebar">
            <h4 class="text-center">Admin Panel</h4>
            <hr>
            <a href="{% url 'admin_dashboard' %}"><i class="fas fa-home"></i> Dashboard</a>
            <a href="{% url 'admin_destination_list' %}"><i class="fas fa-map-marker-alt"></i> Destinations</a>
            <a href="{% url 'user_management' %}"><i class="fas fa-users"></i> Users</a>
            <a href="{% url 'contact_management' %}"><i class="fas fa-envelope"></i> Contacts</a>
            <a href="{% url 'admin_change_password' %}"><i class="fas fa-key"></i> Change Password</a>
            <a href="{% url 'admin_logout' %}"><i class="fas fa-sign-out-alt"></i> Logout</a>
        </div>

        
        <div class="col-md-10 p-4">
            {% block content %}
           
            {% endblock %}
        </div>
    </div>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
