{% extends 'main/base.html' %}

{% block title %}Message Sent | TravelVista{% endblock %}

{% block content %}
<style>
    .sent-wrapper {
        min-height: 75vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: linear-gradient(135deg, #f0f4ff, #e0f2fe);
        padding: 40px 16px;
    }

    .sent-card {
        background: white;
        border-radius: 24px;
        box-shadow: 0 20px 60px rgba(0,0,0,0.1);
        padding: 60px 50px;
        text-align: center;
        max-width: 540px;
        width: 100%;
        animation: slideUp 0.6s ease-out;
    }

    @keyframes slideUp {
        from { opacity: 0; transform: translateY(40px); }
        to   { opacity: 1; transform: translateY(0); }
    }

    .sent-icon {
        width: 80px;
        height: 80px;
        border-radius: 50%;
        background: linear-gradient(135deg, #0d6efd, #00c2ff);
        display: inline-flex;
        align-items: center;
        justify-content: center;
        margin-bottom: 24px;
    }
</style>

<div class="sent-wrapper">
    <div class="sent-card">
        <div class="sent-icon">
            <i class="bi bi-envelope-check-fill text-white" style="font-size: 2rem;"></i>
        </div>

        <h2 class="fw-bold mb-2">Message Sent! ✉️</h2>
        <p class="text-muted mb-4" style="font-size: 1rem; line-height: 1.7;">
            Thank you for reaching out to us! Our team will review your message and get back to you within <strong>24–48 hours</strong>.
        </p>

        <div class="d-flex justify-content-center gap-3 flex-wrap">
            <a href="{% url 'contact' %}" class="btn btn-outline-primary rounded-pill px-4">
                <i class="bi bi-envelope me-2"></i>Send Another
            </a>
            <a href="{% url 'home' %}" class="btn btn-primary rounded-pill px-4">
                <i class="bi bi-house me-2"></i>Go Home
            </a>
        </div>
    </div>
</div>

{% endblock %}
