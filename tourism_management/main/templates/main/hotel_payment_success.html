{% extends 'main/base.html' %}

{% block title %}Booking Confirmed! – TravelVista{% endblock %}

{% block content %}
<div class="container py-5 text-center fade-in">
    <div class="py-5">
        <i class="bi bi-check-circle-fill text-success" style="font-size: 5rem;"></i>
        <h1 class="fw-bold mt-4">Stay Booked Successfully!</h1>
        <p class="text-muted fs-5 mb-5">Your reservation at <strong>{{ booking.hotel.name }}</strong> is confirmed.</p>
        <div class="d-flex gap-3 justify-content-center">
            <a href="{% url 'user_dashboard' %}" class="btn btn-primary rounded-pill px-4 py-2 fw-bold">My Dashboard</a>
            <a href="{% url 'home' %}" class="btn btn-outline-primary rounded-pill px-4 py-2 fw-bold">Back to Home</a>
        </div>
    </div>
</div>
{% endblock %}
